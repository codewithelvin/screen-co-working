# Windows portable exe + Linux AppImage (settings next to the program, D32), plus a .deb and a
# macOS zip for the Homebrew cask (installed copies, per-user settings, D45).
appId: az.company.screencoworking
productName: Screen Co-Working
# Every build lands in the sibling folder screen-co-working-builds/<version>/ (CI overrides it).
directories:
  output: ../../screen-co-working-builds/${version}
files:
  - out/**
  - package.json
asar: true
# Size (2026-11-05): the renderer is a Vite bundle, so only main-process modules (ws) are runtime
# dependencies. One Chromium locale (its own UI strings only; ours are inline), max LZMA, and
# afterPack drops the WebGPU-only shader compiler.
electronLanguages: [en-US]
compression: maximum
afterPack: scripts/after-pack.mjs
win:
  target: portable
  artifactName: Screen-Co-Working-${version}-win-portable.exe
portable:
  requestExecutionLevel: user
  # A fresh temp folder per launch: a second launch must never overwrite the files of a running copy.
  unpackDirName: false
linux:
  target: [AppImage, deb]
  category: Office
  executableName: screen-co-working
  maintainer: Elvin Huseynov <codewithelvin@users.noreply.github.com>
  artifactName: Screen-Co-Working-${version}-linux-${arch}.${ext}
deb:
  packageName: screen-co-working
mac:
  target:
    - target: zip
      arch: [arm64, x64]
  # Not notarised: ad-hoc signing lets Apple Silicon run it; the cask clears quarantine.
  identity: '-'
  hardenedRuntime: false
  notarize: false
  category: public.app-category.productivity
  artifactName: Screen-Co-Working-${version}-mac-${arch}.zip
  extendInfo:
    NSScreenCaptureUsageDescription: Ekranınızı otaqdakı həmkarlarınıza göstərmək üçün.
    NSMicrophoneUsageDescription: Ofisdən kənarda olanda həmkarlarınızla danışmaq üçün.
publish: null
